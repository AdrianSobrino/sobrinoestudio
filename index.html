<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sobrino Estudio — Film portfolio." />
  <title>Sobrino Estudio — Film</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="#top">Sobrino Estudio</a>
      <nav><a href="#work">Work</a><a href="#contact">Contact</a></nav>
    </header>

    <section class="hero" id="top">
      <p class="eyebrow">Film · Commercial · Branded Content</p>
      <h1>Sobrino Estudio</h1>
    </section>

    <section class="work-grid" id="work" aria-label="Selected work">
      <article class="project">
        <button class="project-link" type="button" data-vimeo="1190068384" aria-label="Open video">
          <div class="thumb">
            <img src="https://vumbnail.com/1190068384.jpg" alt="Video project" loading="lazy">
            <span class="play" aria-hidden="true">Play</span>
          </div>
        </button>
      </article>

      <article class="project">
        <button class="project-link" type="button" data-vimeo="1204092804" aria-label="Open video">
          <div class="thumb">
            <img src="https://vumbnail.com/1204092804.jpg" alt="Video project" loading="lazy">
            <span class="play" aria-hidden="true">Play</span>
          </div>
        </button>
      </article>

      <article class="project project-wide">
        <button class="project-link" type="button" data-vimeo="1091736244" aria-label="Open video">
          <div class="thumb">
            <img src="https://vumbnail.com/1091736244.jpg" alt="Video project" loading="lazy">
            <span class="play" aria-hidden="true">Play</span>
          </div>
        </button>
      </article>
    </section>

    <section class="contact" id="contact">
      <p class="eyebrow">Contact</p>
      <a class="email" href="mailto:adrian@sobrinoestudio.com">adrian@sobrinoestudio.com</a>
      <div class="links">
        <a href="https://instagram.com/adrisobrino" target="_blank" rel="noopener">Instagram</a>
        <a href="https://vimeo.com/sobrinoestudio" target="_blank" rel="noopener">Vimeo</a>
      </div>
    </section>

    <footer><span>© <span id="year"></span> Sobrino Estudio</span></footer>
  </main>

  <div class="video-modal" id="videoModal" aria-hidden="true">
    <div class="video-backdrop" data-close="true"></div>
    <div class="video-dialog" role="dialog" aria-modal="true" aria-label="Video player">
      <button class="close" type="button" aria-label="Close video" data-close="true">Close</button>
      <div class="video-frame">
        <iframe
          id="vimeoPlayer"
          src=""
          title="Sobrino Estudio video"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('videoModal');
    const player = document.getElementById('vimeoPlayer');
    const openButtons = document.querySelectorAll('[data-vimeo]');
    const closeButtons = document.querySelectorAll('[data-close]');

    function openVideo(id) {
      player.src = `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0&badge=0&dnt=1`;
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeVideo() {
      player.src = '';
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    openButtons.forEach((button) => {
      button.addEventListener('click', () => openVideo(button.dataset.vimeo));
    });

    closeButtons.forEach((button) => button.addEventListener('click', closeVideo));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('is-open')) closeVideo();
    });

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>

       LIQUID GLASS OVERRIDES

  <style>

    /* -----------------------------------------------------
       GLASS TOKENS
       ----------------------------------------------------- */

    :root {
      --glass-white: rgba(255, 255, 255, 0.92);
      --glass-soft: rgba(255, 255, 255, 0.10);
      --glass-border: rgba(255, 255, 255, 0.20);
    }


    /* -----------------------------------------------------
       HEADER / BRAND
       ----------------------------------------------------- */

    .brand {
      display: inline-flex;
      align-items: center;

      padding: 8px 14px 10px;

      border-radius: 18px;

      color: var(--glass-white);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.17),
          rgba(255, 255, 255, 0.035)
        );

      border:
        1px solid var(--glass-border);

      backdrop-filter:
        blur(18px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(150%);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06),
        0 8px 30px rgba(0, 0, 0, 0.08);

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.18);

      transition:
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.2s ease;
    }


    .brand::after {
      content: "";

      position: absolute;

      inset: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          115deg,
          rgba(255, 255, 255, 0.22),
          transparent 35%,
          transparent 65%,
          rgba(255, 255, 255, 0.08)
        );

      opacity: 0.55;

      pointer-events: none;
    }


    /* -----------------------------------------------------
       CONTACT
       ----------------------------------------------------- */

    .site-contact {
      display: flex;

      align-items: center;
      justify-content: center;

      padding: 8px 14px 9px;

      border-radius: 18px;

      color: var(--glass-white);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.15),
          rgba(255, 255, 255, 0.035)
        );

      border:
        1px solid var(--glass-border);

      backdrop-filter:
        blur(18px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(150%);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.20),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05),
        0 8px 30px rgba(0, 0, 0, 0.08);

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.18);

      transition:
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.2s ease;
    }


    .site-contact::after {
      content: "";

      position: absolute;

      inset: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          110deg,
          rgba(255, 255, 255, 0.18),
          transparent 32%,
          transparent 66%,
          rgba(255, 255, 255, 0.06)
        );

      opacity: 0.5;

      pointer-events: none;
    }


    /* -----------------------------------------------------
       SCROLL-BASED GLASS MOVEMENT
       ----------------------------------------------------- */

    .brand,
    .site-contact {
      --glass-lift: 0px;
      --glass-blur: 18px;
    }


    body.glass-scroll .brand {
      transform:
        translateY(var(--glass-lift))
        translateZ(0);
    }


    body.glass-scroll .site-contact {
      transform:
        translateX(-50%)
        translateY(var(--glass-lift))
        translateZ(0);
    }


    /* -----------------------------------------------------
       ACCESSIBILITY
       ----------------------------------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .brand,
      .site-contact {
        transition: none;
        transform: none !important;
      }

    }


    /* -----------------------------------------------------
       MOBILE
       ----------------------------------------------------- */

    @media (max-width: 700px) {

      .brand {
        padding: 6px 10px 8px;

        border-radius: 14px;
      }


      .site-contact {
        padding: 6px 10px 7px;

        border-radius: 14px;

        gap: 9px;
      }

    }

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    const modal =
      document.getElementById("videoModal");

    const player =
      document.getElementById("vimeoPlayer");

    const openButtons =
      document.querySelectorAll("[data-vimeo]");

    const closeButtons =
      document.querySelectorAll("[data-close]");

    const brand =
      document.querySelector(".brand");

    const contact =
      document.querySelector(".site-contact");


    /* -----------------------------------------------------
       VIDEO OPEN
       ----------------------------------------------------- */

    function openVideo(id) {

      player.src =
        `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0&badge=0&dnt=1`;

      modal.classList.add("is-open");

      modal.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "modal-open"
      );

    }


    /* -----------------------------------------------------
       VIDEO CLOSE
       ----------------------------------------------------- */

    function closeVideo() {

      player.src = "";

      modal.classList.remove(
        "is-open"
      );

      modal.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "modal-open"
      );

    }


    /* -----------------------------------------------------
       OPEN PROJECTS
       ----------------------------------------------------- */

    openButtons.forEach((button) => {

      button.addEventListener(
        "click",
        () => {

          openVideo(
            button.dataset.vimeo
          );

        }
      );

    });


    /* -----------------------------------------------------
       CLOSE VIDEO
       ----------------------------------------------------- */

    closeButtons.forEach((button) => {

      button.addEventListener(
        "click",
        closeVideo
      );

    });


    /* -----------------------------------------------------
       ESCAPE KEY
       ----------------------------------------------------- */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape" &&
          modal.classList.contains("is-open")
        ) {

          closeVideo();

        }

      }
    );


    /* -----------------------------------------------------
       LIQUID GLASS SCROLL RESPONSE
       ----------------------------------------------------- */

    let ticking = false;


    function updateGlass() {

      const scrollY =
        window.scrollY || 0;

      const cycle =
        scrollY % window.innerHeight;

      const progress =
        cycle / window.innerHeight;

      /*
       * Subtle movement only.
       * The interface remains visually fixed,
       * but the glass reacts slightly to scrolling.
       */

      const lift =
        Math.sin(progress * Math.PI * 2) * 2.5;

      const blur =
        18 +
        Math.sin(progress * Math.PI * 2) * 3;

      if (brand) {

        brand.style.setProperty(
          "--glass-lift",
          `${lift}px`
        );

        brand.style.setProperty(
          "--glass-blur",
          `${blur}px`
        );

      }


      if (contact) {

        contact.style.setProperty(
          "--glass-lift",
          `${-lift}px`
        );

        contact.style.setProperty(
          "--glass-blur",
          `${blur}px`
        );

      }


      ticking = false;

    }


    window.addEventListener(
      "scroll",
      () => {

        if (!ticking) {

          window.requestAnimationFrame(
            updateGlass
          );

          ticking = true;

        }

      },
      { passive: true }
    );


    updateGlass();

  </script>

  />

  <title>Sobrino Estudio — Producción audiovisual</title>

  <!-- FAVICON -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F2F0EF'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='middle' text-anchor='middle' font-family='Inter,Arial,Helvetica,sans-serif' font-size='48' font-weight='500' fill='%23111111'%3ES%3C/text%3E%3C/svg%3E"

  <!-- FONT -->

</head>


<body>

  <!-- =====================================================
       FIXED HEADER
       ===================================================== -->

  <header class="site-header">

    <a
      class="brand"
      href="#work"
      aria-label="Sobrino Estudio"
    >
      Sobrino Estudio

  </header>


  <!-- =====================================================
       MAIN CONTENT
       ===================================================== -->

  <main>

    <!-- WORK -->
    <section
      class="work"
      id="work"
      aria-label="Selected work"
    >


      <!-- =================================================

           Vimeo: 1091736244
           Image: imagen3.jpg
           ================================================= -->

      <article class="project">

        <button

          data-vimeo="1091736244"
          aria-label="Open project 1"
        >

            <img
              src="images/imagen3.jpg"
              alt="Film project 1"
            >

            <span
              class="play"
              aria-hidden="true"
            >
              <span class="play-icon"></span>
            </span>

          </div>

        </button>

      </article>


      <!-- =================================================
           PROJECT 2
           Vimeo: 1204092804
           Image: imagen2.jpg
           ================================================= -->

      <article class="project">

        <button
          class="project-link"
          type="button"
          data-vimeo="1204092804"
          aria-label="Open project 2"
        >

          <div class="thumb">

            <img
              src="images/imagen2.jpg"
              alt="Film project 2"
            >

            <span
              class="play"
              aria-hidden="true"
            >
              <span class="play-icon"></span>
            </span>

          </div>

        </button>

      </article>


      <!-- =================================================
           PROJECT 3
           Vimeo: 1190068384
           Image: imagen1.jpg
           ================================================= -->

      <article class="project">

        <button
          class="project-link"
          type="button"
          data-vimeo="1190068384"
          aria-label="Open project 3"
        >

          <div class="thumb">

            <img
              src="images/imagen1.jpg"
              alt="Film project 3"
            >

            <span
              class="play"
              aria-hidden="true"
            >
              <span class="play-icon"></span>
            </span>

          </div>

        </button>

      </article>


    </section>

  </main>


  <!-- =====================================================
       FIXED CONTACT
       ===================================================== -->

  <footer class="site-contact">

    <a
      href="mailto:adrian@sobrinoestudio.com"
    >
      adrian@sobrinoestudio.com
    </a>

    <a
      href="https://instagram.com/adrisobrino"
      target="_blank"
      rel="noopener noreferrer"
    >
      @adrisobrino
    </a>

    <a
      href="tel:+34670359658"
    >
      670 359 658
    </a>

  </footer>


  <!-- =====================================================
       VIDEO MODAL
       ===================================================== -->

  <div
    class="video-modal"
    id="videoModal"
    aria-hidden="true"
  >

    <!-- DARK BACKGROUND -->

    <div
      class="video-backdrop"
      data-close="true"
    ></div>


    <!-- VIDEO CONTAINER -->

    <div
      class="video-dialog"
      role="dialog"
      aria-modal="true"
      aria-label="Video player"
    >

      <!-- CLOSE -->

      <button
        class="close"
        type="button"
        aria-label="Close video"
        data-close="true"
      >
        Close
      </button>


      <!-- VIMEO -->

      <div class="video-frame">

        <iframe
          id="vimeoPlayer"
          src=""
          title="Sobrino Estudio video"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
        ></iframe>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    const modal =
      document.getElementById("videoModal");

    const player =
      document.getElementById("vimeoPlayer");

    const openButtons =
      document.querySelectorAll("[data-vimeo]");

    const closeButtons =
      document.querySelectorAll("[data-close]");


    /*
     * Open Vimeo video
     */

    function openVideo(id) {

      player.src =
        `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0&badge=0&dnt=1`;

      modal.classList.add("is-open");

      modal.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "modal-open"
      );

    }


    /*
     * Close Vimeo video
     */

    function closeVideo() {

      player.src = "";

      modal.classList.remove(
        "is-open"
      );

      modal.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "modal-open"
      );

    }


    /*
     * Open video when clicking a project
     */

    openButtons.forEach((button) => {

      button.addEventListener(
        "click",
        () => {

          openVideo(
            button.dataset.vimeo
          );

        }
      );

    });


    /*
     * Close video
     */

    closeButtons.forEach((button) => {

      button.addEventListener(
        "click",
        closeVideo
      );

    });


    /*
     * Close with Escape
     */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape" &&
          modal.classList.contains("is-open")
        ) {

          closeVideo();

        }

      }
    );

  </script>

</body>
</html>
